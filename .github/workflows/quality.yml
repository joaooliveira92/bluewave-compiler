name: Quality Gate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm check:licenses
      - run: pnpm preflight
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm test:scripts
      - run: pnpm typecheck
      # --force: typecheck's `^build` populates the turbo cache first, and a
      # replayed desktop build then reads a stale phase-engine `dist`. Build
      # from source here so the gate is not at the mercy of cache replay.
      - run: pnpm exec turbo run build --force
      # The app hard-depends on the compiled content artifact; build it
      # explicitly so a green run cannot mean the tests executed against a
      # stale or missing artifact (it is otherwise only produced as a side
      # effect of the desktop build and the desktop vitest global setup).
      - name: Build the compiled content artifact
        run: pnpm content:build
      - run: pnpm test:run
      - name: Balance reports match the deterministic benchmark
        run: pnpm check:balance-reports
      # Informational only: publishes the change scope for change-based CI
      # filtering (see docs/agents/change-scope.md). Never gates the job — a
      # scope error must not be able to turn a required check green or red.
      - name: Change scope (informational)
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base ref (workflow_dispatch or new branch); skipping change-scope"
          else
            pnpm change-scope --base "$BASE"
          fi
