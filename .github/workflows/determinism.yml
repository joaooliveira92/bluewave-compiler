name: Determinism Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.0.0"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Cross-process determinism
        run: node packages/cross-process-test/dist/run-child.js
      - name: Upload hash artifact
        uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.os }}
          path: golden/hashes.json
      - name: Verify golden hashes
        run: node scripts/verify-golden-hashes.cjs
