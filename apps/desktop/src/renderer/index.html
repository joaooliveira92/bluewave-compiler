<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Bluewave Campaign Compiler</title>
  </head>
  <body>
    <h1>Bluewave Campaign Compiler</h1>
    <div id="tabs" class="tabs">
      <button id="editorTabBtn" class="tab active">Editor</button>
      <button id="viewerTabBtn" class="tab">Campaign Save Viewer</button>
    </div>

    <div id="editorTab">
      <div id="fileActions">
        <button id="newBtn">New Project</button>
        <button id="openBtn">Open Project</button>
        <button id="saveBtn" disabled>Save Project</button>
        <button id="saveAsBtn" disabled>Save Project As</button>
        <button id="compileBtn" disabled>Compile Campaign</button>
      </div>
      <div id="status">
        Welcome. Click "New Project" to create one from a content directory, or "Open
        Project" to load an existing .bluewave project.
      </div>
      <div id="output"></div>
    </div>

    <div id="viewerTab" class="hidden">
      <div class="banner-info">
        Viewing a campaign save is separate from your open project — nothing here
        affects the .bluewave project you're authoring.
      </div>
      <button id="loadSaveBtn">Load Campaign Save</button>
      <div id="saveStatus"></div>
      <div id="saveOutput"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
