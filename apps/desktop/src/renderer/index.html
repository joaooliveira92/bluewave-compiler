<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'"
    />
    <title>Bluewave Campaign Compiler</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        padding: 20px;
      }
      h1 { font-size: 1.4rem; margin-bottom: 16px; color: #a8d8ea; }
      button {
        background: #0f3460;
        color: #e0e0e0;
        border: 1px solid #16213e;
        padding: 10px 20px;
        font-size: 0.95rem;
        cursor: pointer;
        border-radius: 4px;
        margin-bottom: 16px;
      }
      button:hover { background: #16213e; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #status {
        margin-bottom: 12px;
        font-style: italic;
        color: #a8d8ea;
      }
      #output {
        background: #16213e;
        border: 1px solid #0f3460;
        border-radius: 4px;
        padding: 12px;
        font-size: 0.85rem;
        font-family: "SF Mono", "Fira Code", monospace;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 500px;
        overflow-y: auto;
      }
      .error { color: #e74c3c; }
      .success { color: #2ecc71; }
      .info { color: #3498db; }
    </style>
  </head>
  <body>
    <h1>Bluewave Campaign Compiler</h1>
    <button id="compileBtn">Compile Campaign</button>
    <div id="status">Ready. Click "Compile Campaign" to select a content directory.</div>
    <div id="output"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
