appId: com.bluewave.desktop
productName: Bluewave
directories:
  buildResources: build
  output: dist-electron
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!{tsconfig.tsbuildinfo,.gitignore}"
# Content ships as application resources (resolved from process.resourcesPath,
# see src/main/contentPack.ts), not by a repo-root walk. The compiled artifact
# is the runtime content boundary (ADR-0122); the production tree ships so a
# packaged build can compile a fresh campaign (ticket 05; folded into the
# artifact by ticket 07).
extraResources:
  - from: ../../content/generated/1880
    to: content/generated/1880
  - from: ../../content/production/1880
    to: content/production/1880
mac:
  artifactName: ${name}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarization is automatic when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID are set (see docs/delivery/desktop-signing.md); skipped locally.
win:
  artifactName: ${name}-${version}-setup.${ext}
  target:
    - nsis
  executableName: bluewave
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  artifactName: ${name}-${version}.${ext}
  target:
    - AppImage
  category: Utility
  maintainer: bluewave@example.com
