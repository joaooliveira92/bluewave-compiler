appId: com.bluewave.desktop
productName: Bluewave
directories:
  buildResources: build
  output: dist-electron
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!{tsconfig.tsbuildinfo,.gitignore}"
# Content ships as application resources (resolved from process.resourcesPath,
# see src/main/contentPack.ts), not by a repo-root walk. The compiled artifact is
# the only runtime content boundary (ADR-0122/ADR-0124): the campaign compiler
# and the ship-building/reference-design loaders all read it, so the raw
# production tree is a build-time input to `content:build`, not a shipped
# resource (tickets 05/07).
extraResources:
  - from: ../../content/generated/1880
    to: content/generated/1880
mac:
  artifactName: ${name}-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarization is automatic when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID are set (see docs/delivery/desktop-signing.md); skipped locally.
win:
  artifactName: ${name}-${version}-setup.${ext}
  target:
    - nsis
  executableName: bluewave
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  artifactName: ${name}-${version}.${ext}
  target:
    - AppImage
  category: Utility
  maintainer: bluewave@example.com
