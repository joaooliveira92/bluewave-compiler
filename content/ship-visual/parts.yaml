# Ship-visual part catalog (ADR-0148). PRESENTATION ONLY: no content pack declares this file, so it never enters a
# compiled artifact, a campaign snapshot or a golden hash. Decoded by `ShipVisualCatalogSchema`
# (@bluewave/content-schema) and generated into `packages/ship-visual/src/catalog.generated.ts`:
#
#   pnpm --filter @bluewave/content-schema build && pnpm --filter @bluewave/ship-visual catalog:generate
#
# Drawing units: METRES AT THE 12-INCH REFERENCE (manual p142 "draw the gun to match the size of a 12-inch gun"); the
# renderer rescales by calibre. Origin at the seat centre, y DOWN, bow to the LEFT: barrels run
# toward -x. A CASEMATE hangs from the deck edge, so its drawing lies below the origin (y > 0). Keys: style (manual p140 letters; X universal), era (VICTORIAN/PRE_DREADNOUGHT/DREADNOUGHT/
# LATE_DREADNOUGHT), size (SMALL <=5 in, MEDIUM 6-11 in, LARGE >=12 in), mountClass, optional guns (1-4).
# Fallback: exact -> X same era -> own style DREADNOUGHT -> X DREADNOUGHT, so X x DREADNOUGHT must cover every size x
# class (test-enforced).

mounts:
  # ---------------------------------------------------------------- X x DREADNOUGHT (the universal default)
  - id: x-dreadnought-large-turret
    key: { style: X, era: DREADNOUGHT, size: LARGE, mountClass: TURRET }
    profile:
      widthM: 11
      shapes:
        - { tone: structure, d: "M -4.6 0 L 4.6 0 L 4.6 -1 L -4.6 -1 Z" }
        - { tone: structure, d: "M -5.5 -1 L 5.5 -1 L 5.5 -3.6 L -3.8 -3.6 L -5.5 -2.6 Z" }
        - { tone: structure, d: "M 1 -3.6 L 2.6 -3.6 L 2.4 -4.1 L 1.2 -4.1 Z" }
      barrel: { x: -5.2, y: -2.3, lengthM: 14, boreM: 0.55 }
    plan: { body: ROUND, diameterM: 10, barrel: { lengthM: 14, boreM: 0.6, spacingM: 2.4 } }
    # Shared by every drawing below (YAML anchor).
    provenance: &drawing
      sourceStatus: ESTIMATE
      confidence: LOW
      kind: game_conversion
      sources:
        - title: "Rule the Waves 3 manual, Appendix 5: creating turret files"
          page: "139-142"
      note: >-
        Schematic drawing authored to the manual's turret-file key (nationality x era x size x type x guns) at the
        12-inch reference; proportions are illustrative, not traced from a plan.
  - id: x-dreadnought-medium-turret
    key: { style: X, era: DREADNOUGHT, size: MEDIUM, mountClass: TURRET }
    profile:
      widthM: 9
      shapes:
        - { tone: structure, d: "M -3.8 0 L 3.8 0 L 3.8 -0.8 L -3.8 -0.8 Z" }
        - { tone: structure, d: "M -4.5 -0.8 L 4.5 -0.8 L 4.5 -3.4 L -3.2 -3.4 L -4.5 -2.4 Z" }
      barrel: { x: -4.3, y: -2.1, lengthM: 13, boreM: 0.5 }
    plan: { body: ROUND, diameterM: 8.5, barrel: { lengthM: 13, boreM: 0.55, spacingM: 2.2 } }
    provenance: *drawing
  - id: x-dreadnought-small-turret
