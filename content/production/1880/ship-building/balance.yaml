  # Yards (ADR-0067 section 6). Per-line capacity is maxDisplacement(t) x yardWorkPerTonneMonth, so a bigger yard works faster and
  # the "limited by <line>" bottleneck is meaningful. Limits and rate are ESTIMATES: sized to the 1880-1900 hull classes
  # (destroyer/torpedo boat, cruiser, battleship), not to named historical slips.
  facilities:
    - {
        id: yard_small,
        maxLengthMm: 110000,
        maxBeamMm: 15000,
        maxDisplacementKg: 3000000,
        craneLiftKg: 80000,
      }
    - {
        id: yard_medium,
        maxLengthMm: 150000,
        maxBeamMm: 22000,
        maxDisplacementKg: 9000000,
        craneLiftKg: 150000,
      }
    - {
        id: yard_large,
        maxLengthMm: 200000,
        maxBeamMm: 40000,
        maxDisplacementKg: 30000000,
        craneLiftKg: 250000,
      }
  # PLACEHOLDER rate (ESTIMATE): 700 work micro-units per tonne of maxDisplacement per month per line. The large yard (30,000 t)
  # keeps the 21,000,000 that ticket 20 needed for a Majestic-size hull (276M work) to finish inside maxMonths; the small yard
  # (3,000 t) has 2,100,000 and cannot hold a battleship at all.
  yardWorkPerTonneMonth: 700
  # Engine projection: displacement per hit point; the median of the 37 authored 1880-pack designs is ~214,000 kg.
  kgPerHitPoint: 214000
  # Micro-pounds per treasury unit: one unit of campaign treasury and project work is GBP 10,000. Calibrated so a Majestic-class battleship
  # costs about as many units as the original displacement formula gave (about 125); designed ships are priced by the cost model.
  treasuryUnitMicro: 10000000000
# Revision tiers for changes during construction (spec section 15.4, ADR-0070). These are GAME-DESIGN CONSTANTS, not historical data, so
# no source exists for them; they are decided here and checked by `checkRevisionBalance` (ranges, ascending thresholds, a redesign never
# milder than a revision). Not yet play-tested: tune from play, never to fit a source.
#   freeBelowBp / revisionBelowBp / redesignBelowBp: hull-progress thresholds, 5 / 25 / 50 percent (spec).
#   reworkBp: a revision (T1) redoes 30 % of the work already done on what it changes.
#   redesignKeptBp: a redesign (T2) keeps 50 % of the hull work (the structure is salvaged, the rest is scrapped).
#   t1DelayMonths: 1 (spec: at least one month). t2DelayMonths: 4, a third of a year of redrawing and re-laying plates.
#   redesignStudyCostBp: UNUSED until design studies exist (DESIGN-21 section 3); the multiplier is carried so the rule is complete.
revision:
  freeBelowBp: 500
  revisionBelowBp: 2500
  redesignBelowBp: 5000
  reworkBp: 3000
  t1DelayMonths: 1
  redesignStudyCostBp: 6000
  redesignKeptBp: 5000
  t2DelayMonths: 4

# Rebuild validation (ticket 28; DESIGN-23 section 21 "rebuild_validation_v1"). These are the rule's own shipped values, not
# placeholders: displacement +20 %, designed speed +3 kn, hull length and beam +/-5 %. A change of hull form is always refused.
rebuild:
  maxDisplacementIncreaseBp: 2000
  maxSpeedIncreaseMilliKnots: 3000
  maxLengthChangeBp: 500
  maxBeamChangeBp: 500
