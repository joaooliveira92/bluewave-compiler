  # Dimensions/speed/armament/armour are the sourced figures; where the hull-weight model needs a moulded depth it is an ESTIMATE
  # (no source gives moulded depth for any of these ships). The magazine box and turret masses are ESTIMATE (no source).
  # Torpedo tubes: the 14-inch Whitehead is used as the catalogue's 1880 model (the RN boats actually carried 16-in; recorded approximation).

