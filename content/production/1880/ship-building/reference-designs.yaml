# Reference designs for the EARLY band (starting points for the Drawing Board and regression fixtures).
# Havock-like: first-class destroyer, 1893 (dimensions, 3,500 ihp, 57 t coal, armament from docs/research/ship-building-early-band.md).
# Majestic-like: pre-dreadnought battleship, 1895 (naturally class B under DESIGN-22: two twin turrets).
# Fittings (magazines, quarters, pumps, ventilation) weigh nothing extra: White 1894 pp. 409-410 counts them in the hull weight (ADR-0083).
# Equipment that is still unsourced (dynamo, rangefinder) is marked in components.yaml, not here.
# Torpedo cruiser (1880): the only kind of ship January 1880 content can build (machine guns and torpedoes; a CL of ~2,200 t).
