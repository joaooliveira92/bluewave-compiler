# National naval profiles (NationNavalProfile) for the EARLY band. Two contrasting vertical slices: the United
# Kingdom (global battle-fleet + colonial-cruiser power) and France (Jeune-École commerce raiding + torpedo warfare).
# Discipline: every historical value carries a provenance block (sourceStatus / confidence / kind / sources); every
# balance target is labelled `balance_adjustment`. Grounding: docs/research/national-naval-profiles-uk-france.md.
# Hard capability only ever restricts (UNAVAILABLE families, calibre ceilings); it never grants. Soft doctrine steers
# templates, AI scoring and procurement, and never blocks a legal design (docs/ships-nation-orientation.md, ADR-0089).
